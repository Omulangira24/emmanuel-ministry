<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Request | Emmanuel Ministry</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Prayer Request</h1>
    <p>We are honoured to pray with you.</p>
</header>

<section class="prayer-form">

<input type="text" id="name" placeholder="Your Name">

<input type="email" id="email" placeholder="Your Email Address">

<textarea id="prayer" placeholder="Write your prayer request here..."></textarea>

<button id="sendPrayer">
Send Prayer Request
</button>

<p id="result"></p>

</section>

<script type="module" src="prayer.js"></script>

</body>
</html>
